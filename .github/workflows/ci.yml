name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # DB 테스트가 CI 에서도 돌아야 한다. 로컬(5433)과 달리 CI 는 5432 를 쓴다.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: certpilot
          POSTGRES_PASSWORD: certpilot
          POSTGRES_DB: certpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U certpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://certpilot:certpilot@localhost:5432/certpilot
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv sync --frozen

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy app

      - name: alembic 마이그레이션
        run: uv run alembic upgrade head

      - name: pytest
        run: uv run pytest -q

  web:
    name: web (eslint + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Node 22 설치
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: eslint
        run: npm run lint

      # build 가 next-env.d.ts 와 .next/types 를 만들어 주므로 tsc 보다 먼저 돌린다.
      - name: build
        run: npm run build

      - name: tsc
        run: npm run typecheck

  secrets:
    name: 비밀 스캔 (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
