[project]
name = "certpilot-api"
version = "0.1.0"
description = "CertPilot API — ISMS-P 준비·유지 코파일럿 백엔드"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery>=5.4",
    "pdfplumber>=0.11.10",
    "pypdf>=6.16.2",
    "bcrypt>=5.0.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.32",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "boto3>=1.43.79",
    "pgvector>=0.5.0",
    "pyyaml>=6.0.3",
    "anthropic>=1.0.0",
    "reportlab>=5.0.1",
    "cryptography>=50.0.0",
    "openai>=3.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "moto>=5.2.3",
    "types-pyyaml>=6.0.12.20260815",
    "types-boto3>=1.43.79",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
