# CertPilot 데모 배포용 compose (VM 1대).
#
# 특정 클라우드에 묶이지 않는다. AWS EC2 든 오라클 클라우드 무료 VM 이든
# docker + compose v2 가 있는 리눅스 한 대면 뜬다(README-deploy.md §1).
#
# 로컬 개발용 `docker-compose.yml` 과 다른 점
#   - api·web 을 컨테이너로 띄운다(로컬은 호스트에서 `make api`/`make web`).
#   - 관리형 서비스(RDS·S3)를 기본으로 본다. 관리형이 없는 VM 한 대짜리
#     구성은 아래 두 프로파일로 컨테이너를 대신 켠다.
#
# 프로파일
#   local-db       postgres 컨테이너를 켠다(RDS·관리형 DB 를 안 쓸 때).
#                  .env.prod 의 DATABASE_URL 호스트를 `postgres` 로 바꾼다.
#   local-storage  MinIO 컨테이너를 켠다(S3·오라클 Object Storage 를 안 쓸 때).
#                  .env.prod 의 S3_ENDPOINT 를 `http://minio:9000` 으로 바꾼다.
#
# 사용:
#   cd infra/deploy
#   cp .env.prod.example .env.prod   # 값을 채운다
#   ./deploy.sh
#
# VM 한 대에서 관리형 서비스 없이 전부 돌릴 때(오라클 무료 VM 기본 조합):
#   docker compose -f docker-compose.prod.yml \
#     --profile local-db --profile local-storage up -d
#   # 또는 .env.prod 에 CERTPILOT_PROFILES=local-db,local-storage 를 넣고 ./deploy.sh
#
# 주의: 이 파일을 `docker compose config` 로 렌더하려면 같은 디렉터리에 `.env.prod`
# 가 있어야 한다(서비스의 env_file 이 가리킨다). `.env.prod.example` 을 복사해 둔다.

name: certpilot

x-api-base: &api-base
  build:
    # 컨텍스트가 리포 루트여야 data/criteria/criteria.json 이 이미지에 들어간다.
    context: ../..
    dockerfile: apps/api/Dockerfile
  image: certpilot-api:${IMAGE_TAG:-latest}
  env_file: .env.prod
  restart: unless-stopped
  # 컨테이너 안에서 스택트레이스가 로그로 바로 나오게 한다.
  environment:
    PYTHONUNBUFFERED: "1"

services:
  api:
    <<: *api-base
    container_name: certpilot-api
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      # 리버스 프록시(Nginx/ALB) 뒤에 둔다. 신뢰할 프록시는 배포 환경에 맞춘다.
      - --forwarded-allow-ips
      - "*"
    ports:
      # 기본은 루프백. 앞단 리버스 프록시(Nginx)가 TLS 종료와 라우팅을 맡는다.
      # 프록시 없이 공인 IP 로 바로 접속시킬 때만 .env.prod 에서 API_BIND=0.0.0.0
      # 으로 바꾼다(그때는 방화벽에서 8000 을 열어야 한다).
      - "${API_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    <<: *api-base
    container_name: certpilot-worker
    # 모의심사·인제스트·수집 잡을 처리한다. 동시 실행 수는 인스턴스 크기에 맞춘다.
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - -l
      - info
      - --concurrency
      - "${CELERY_CONCURRENCY:-2}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    <<: *api-base
    container_name: certpilot-beat
    # 일 1회 AWS 증적 수집 스케줄(app/workers/collect.py 의 beat_schedule).
    # 스케줄 상태 파일은 컨테이너가 재시작돼도 남도록 볼륨에 둔다.
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - beat
      - -l
      - info
      - --schedule
      - /var/lib/celery/beat-schedule
    volumes:
      - beat_state:/var/lib/celery
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 는 빌드 시점에 번들에 박힌다. 주소가 바뀌면 재빌드가 필요하다.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: certpilot-web:${IMAGE_TAG:-latest}
    container_name: certpilot-web
    restart: unless-stopped
    ports:
      # api 와 같은 규칙. 프록시 없이 http://<공인IP>:3000 으로 보여 줄 때만
      # .env.prod 에서 WEB_BIND=0.0.0.0 으로 바꾼다.
      - "${WEB_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      - api

  redis:
    image: redis:7
    container_name: certpilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # RDS 를 쓰지 않을 때만 켠다: `--profile local-db`.
  # 이 경우 .env.prod 의 DATABASE_URL 호스트를 `postgres` 로 바꾼다.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: certpilot-postgres
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-certpilot}
      # 값 검증은 deploy.sh 가 한다(이 프로파일을 켰을 때만). 여기서 `:?` 로 막으면
      # 프로파일을 안 쓰는 관리형 DB 배포에서도 렌더가 실패한다 — 보간은 프로파일과
      # 무관하게 먼저 일어나기 때문이다. 비어 있으면 postgres 가 기동을 거부한다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-certpilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-certpilot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 실제 S3(또는 오라클 Object Storage)를 쓰지 않을 때만 켠다: `--profile local-storage`.
  # 이 경우 .env.prod 의 S3_ENDPOINT 를 `http://minio:9000` 으로 바꾼다.
  # api·worker 는 compose 네트워크 안에서 `minio` 이름으로 붙으므로 9000 을 호스트에
  # 게시하지 않는다. 데이터는 이 VM 의 볼륨에만 있으니 백업 대상에 포함시킨다.
  minio:
    image: minio/minio
    container_name: certpilot-minio
    profiles: ["local-storage"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # 루트 자격증명 = 앱이 쓰는 S3 키. 어긋나면 업로드가 403 으로 떨어진다.
      # MinIO 제약(사용자 3자 이상, 비밀번호 8자 이상)은 deploy.sh 가 이 프로파일을
      # 켰을 때만 검사한다. postgres 와 같은 이유로 여기서 `:?` 를 쓰지 않는다.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
    volumes:
      - minio_data:/data
    ports:
      # 웹 콘솔만 루프백에 연다. 외부에서 볼 일이 있으면 SSH 터널을 쓴다:
      #   ssh -L 9001:127.0.0.1:9001 <사용자>@<서버>
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  redis_data:
  postgres_data:
  minio_data:
  beat_state:
